[www]
; Override the default access log setting from zz-docker.conf to send it to null.
access.log = /dev/null

; --- 效能與資源管理設定 (保守版本) ---
; 使用動態進程管理器
pm = dynamic

; 【核心設定】最大子進程數
; 根據你的 8GB RAM 和 50MB/進程的消耗，30 是一個非常安全且高效的起點。
; 這能處理比現在多 6 倍的併發請求，同時為其他服務留有充足的記憶體緩衝。
pm.max_children = 30

; 服務啟動時建立的子進程數
; 建議設為最大值的 25% 左右
pm.start_servers = 8

; 伺服器空閒時最少保留的子進程數
; 建議設為最大值的 15-20%
pm.min_spare_servers = 5

; 伺服器空閒時最多保留的子進程數
; 建議設為最大值的 30-40%
pm.max_spare_servers = 12

; 每個子進程處理 500 個請求後自動重啟，防止記憶體洩漏
pm.max_requests = 500
