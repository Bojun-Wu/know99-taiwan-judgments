services:
  caddy:
    image: caddy:2-alpine
    env_file:
      - stack.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - caddy_proxy
    depends_on:
      - laravel
    restart: unless-stopped

  # Build locally on the VM; no Docker Hub application image is required.
  laravel:
    build:
      context: .
      dockerfile: Dockerfile
    image: know99:local
    env_file:
      - stack.env
    expose:
      - "80"
    networks:
      - laravel_network
      - caddy_proxy
    volumes:
      - laravel_sitemap:/var/www/html/public/sitemaps
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      typesense:
        condition: service_started
    restart: unless-stopped

  queue-worker:
    image: know99:local
    entrypoint: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=120"]
    env_file:
      - stack.env
    networks:
      - laravel_network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  inertia-ssr:
    image: know99:local
    entrypoint: ["php", "artisan", "inertia:start-ssr"]
    env_file:
      - stack.env
    expose:
      - "13714"
    networks:
      - laravel_network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    env_file:
      - stack.env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  typesense:
    image: typesense/typesense:28.0
    env_file:
      - stack.env
    environment:
      TYPESENSE_API_KEY: ${TYPESENSE_API_KEY}
      TYPESENSE_DATA_DIR: /typesense-data
      TYPESENSE_ENABLE_CORS: "true"
    volumes:
      - typesense:/typesense-data
    networks:
      - laravel_network
    restart: unless-stopped

  redis:
    image: redis:7.4.4-alpine
    volumes:
      - redis:/data
    networks:
      - laravel_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  caddy_data:
    name: know99-caddy-data
  caddy_config:
    name: know99-caddy-config
  laravel_sitemap:
    name: know99-sitemap
  postgres:
    name: know99-postgres
  typesense:
    name: know99-typesense
  redis:
    name: know99-redis

networks:
  laravel_network:
    driver: bridge
  caddy_proxy:
    driver: bridge
